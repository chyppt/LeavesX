name: Leaves Test CI

on:
  push:
    branches-ignore: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v5
      - name: Get JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false
      - name: Setup Git Config
        run: |
          git config --global user.email "ci-test@leavesmc.org"
          git config --global user.name "LeavesMC Test CI"
      - name: Apply Patches
        run: ./gradlew applyAllPatches
      - name: Create Leavesclip Jar
        run: ./gradlew createLeavesclipJar
      - name: Move Jar
        run: |
          set -euo pipefail
          prop() {
            awk -F= -v key="$1" '$1 == key { val = $2; sub(/[[:space:]]*#.*$/, "", val); gsub(/^[[:space:]]+|[[:space:]]+$/, "", val); print val }' gradle.properties
          }

          jarName="leavesx-$(prop mcVersion).jar"
          sourceJar="$(find leaves-server/build/libs -maxdepth 1 -type f -name 'leavesx-*.jar' -print -quit)"
          if [[ -z "$sourceJar" ]]; then
            # Keep compatibility with older CreateLeavesclipJar output names.
            sourceJar="$(find leaves-server/build/libs -maxdepth 1 -type f -name '*leavesclip*.jar' -print -quit)"
          fi
          if [[ -z "$sourceJar" ]]; then
            echo "No LeavesX distributable jar found in leaves-server/build/libs" >&2
            exit 1
          fi
          cp "$sourceJar" "$jarName"
          echo "jar=$jarName" >> "$GITHUB_ENV"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jar }}
          path: ${{ env.jar }}
