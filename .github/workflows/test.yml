name: LeavesX 构建与回归测试

on:
  push:
    branches-ignore: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v5
      - name: Get JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false
      - name: Setup Git Config
        run: |
          git config --global user.email "ci@leavesx.local"
          git config --global user.name "LeavesX CI"
      - name: Apply Patches
        run: ./gradlew applyAllPatches
      - name: Run regression tests
        run: ./gradlew :leaves-server:test
      - name: Create server bundle
        run: ./gradlew :leaves-server:createBundlerJar
      - name: Move Jar
        run: |
          set -euo pipefail
          prop() {
            awk -F= -v key="$1" '$1 == key { val = $2; sub(/[[:space:]]*#.*$/, "", val); gsub(/^[[:space:]]+|[[:space:]]+$/, "", val); print val }' gradle.properties
          }

          jarName="LeavesX-$(prop leavesXVersion)-$(prop mcVersion).jar"
          sourceJar="leaves-server/build/libs/leaves-bundler-$(prop mcVersion)-R0.1-SNAPSHOT.jar"
          if [[ ! -f "$sourceJar" ]]; then
            echo "No LeavesX distributable jar found in leaves-server/build/libs" >&2
            exit 1
          fi
          cp "$sourceJar" "$jarName"
          sha256sum "$jarName" > "$jarName.sha256"
          echo "jar=$jarName" >> "$GITHUB_ENV"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jar }}
          path: |
            ${{ env.jar }}
            ${{ env.jar }}.sha256
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            leaves-server/build/reports/tests/
            leaves-server/build/test-results/
          if-no-files-found: ignore
